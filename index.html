<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>손가락 운동회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #2a2466 0%, #1a1440 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:10px; }
  #wrap { position:relative; }
  #game {
    display:block; border-radius:26px; touch-action:none;
    box-shadow:0 0 0 4px var(--ink), 0 10px 0 4px var(--ink), 0 24px 50px rgba(0,0,0,.45);
  }
  #topbar { position:absolute; top:12px; right:12px; display:flex; gap:8px; z-index:2; }
  #topbar button {
    background:#fff; border:3px solid var(--ink); color:var(--ink);
    width:40px; height:40px; border-radius:14px; font-size:17px; cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
  }
  #topbar button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:14px;
    text-align:center; padding:64px 18px 26px;   /* 위는 소리·일시정지 버튼 자리 */
    background:rgba(43,29,82,.55);
    backdrop-filter:blur(3px);
    border-radius:26px;
    overflow-y:auto;
    touch-action:pan-y;   /* body 가 touch-action:none 이라 설명이 판보다 길면 스크롤이 막혔다 */
  }
  /* 세로가 짧은 폰(로비 안에서 열면 더 짧다): 시작 버튼이 가려지지 않게 촘촘하게 */
  @media (max-height:700px) {
    #overlay { gap:9px; padding-top:54px; }
    #overlay .icon-big { width:72px; height:72px; font-size:30px; border-radius:22px; box-shadow:0 5px 0 var(--ink); }
    #overlay h2 { font-size:30px; }
    #overlay .help { font-size:13px; padding:8px 12px; line-height:1.55; }
    #overlay .main { font-size:21px; padding:9px 38px; margin-top:0; }
    #overlay .cards { gap:10px; }
    #overlay .card { padding:9px 12px; }
  }
  #overlay.hidden { display:none; }
  /* 흰 글자 + 진한 테두리 + 아래 그림자: 캔버스 글자와 같은 느낌 */
  .inked { color:#fff; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(34px, 11vw, 46px); font-weight:400; line-height:1.1; letter-spacing:.01em; }
  #overlay h1 .y { color:var(--yellow); }
  #overlay h2 { font-size:38px; font-weight:400; }
  #overlay p { font-size:16px; line-height:1.5; color:#fff; }
  #overlay .tag {
    display:inline-block; background:var(--pink); color:#fff; font-size:15px;
    padding:4px 14px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink);
  }
  #overlay .cards { display:flex; flex-direction:column; gap:14px; width:100%; max-width:330px; margin-top:4px; }
  #overlay .card {
    display:grid; grid-template-columns:56px 1fr; align-items:center; gap:12px; text-align:left;
    background:#fff; border:3px solid var(--ink); border-radius:22px; padding:12px 14px; cursor:pointer;
    box-shadow:0 6px 0 var(--ink); color:var(--ink); font-family:inherit;
  }
  #overlay .card:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  #overlay .card .ico {
    width:56px; height:56px; border-radius:16px; border:3px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:21px; white-space:nowrap; letter-spacing:-2px;
  }
  #overlay .card .txt { min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
  #overlay .card b { font-size:21px; font-weight:400; white-space:nowrap; }
  #overlay .card small { font-size:12px; line-height:1.35; color:#6b5c95; font-family:-apple-system, 'Apple SD Gothic Neo', sans-serif; }
  #overlay .card .best {
    font-size:13px; background:var(--yellow); border:2px solid var(--ink); border-radius:999px; padding:2px 8px;
    font-variant-numeric:tabular-nums; white-space:nowrap; margin-top:3px;
  }
  #overlay .card .best:empty { display:none; }
  #overlay .card.soon { background:rgba(255,255,255,.35); box-shadow:none; cursor:default; border-style:dashed; color:#fff; }
  #overlay .card.soon small { color:rgba(255,255,255,.8); }
  #overlay .card.soon .ico { border-style:dashed; border-color:#fff; }

  #overlay .icon-big {
    width:110px; height:110px; border-radius:30px; border:4px solid var(--ink); box-shadow:0 7px 0 var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:44px; background:#fff;
  }
  #overlay .help {
    background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink);
    padding:12px 16px; font-size:15px; line-height:1.7; color:var(--ink); max-width:330px;
  }
  #overlay .big { font-size:64px; line-height:1; color:var(--yellow); }
  #overlay .stats {
    display:grid; grid-template-columns:auto auto; gap:6px 18px; font-size:17px;
    background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink);
    padding:12px 22px; font-variant-numeric:tabular-nums;
  }
  #overlay .stats dt { color:#6b5c95; text-align:right; }
  #overlay .stats dd { text-align:left; }
  #overlay .main {
    margin-top:6px;
    background:var(--yellow); color:var(--ink); font-size:24px; font-family:inherit;
    border:3px solid var(--ink); border-radius:999px; padding:12px 44px;
    box-shadow:0 6px 0 var(--ink); cursor:pointer;
  }
  #overlay .main:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  #overlay .sub { background:none; border:none; color:#fff; font-size:17px; cursor:pointer; padding:6px; font-family:inherit; opacity:.9; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="topbar">
      <button id="muteBtn" title="소리 (M)">🔊</button>
      <button id="pauseBtn" title="일시정지 (Esc)">⏸</button>
    </div>
    <div id="overlay"></div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
